# Produkcja na VPS: `cd app && cp .env.example .env` (uzupełnij), potem `docker compose up -d --build`.
# Aplikacja nasłuchuje tylko na 127.0.0.1:3000 – na świat wystawia ją Caddy (deploy/Caddyfile) z HTTPS.
name: sprawdz-ogloszenie

x-common: &common
  image: sprawdz-ogloszenie:latest
  env_file: .env
  environment:
    NODE_ENV: production
    TRUST_PROXY: "1"
  volumes:
    - appdata:/srv/app/data
  restart: unless-stopped

services:
  app:
    <<: *common
    build:
      context: ..
      dockerfile: app/Dockerfile
    ports:
      - "127.0.0.1:3000:3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/api/health >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

  # Zadania okresowe: co godzinę e-maile przypominające i sprzątanie (raporty > 30 dni, zdjęcia > 48 h).
  cron:
    <<: *common
    depends_on:
      app:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        while true; do
          node dist-scripts/followup.cjs
          node dist-scripts/cleanup.cjs
          sleep 3600
        done
    healthcheck:
      disable: true

volumes:
  appdata:
